name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        # --exclude xfade-gui: the Tauri GUI needs GTK/WebKit system libs only present
        # in its macOS build job (release.yml), not on a bare ubuntu runner.
        run: cargo clippy --all-targets --workspace --exclude xfade-gui -- -D warnings
      - name: test
        run: cargo test --workspace --exclude xfade-gui

  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: crates/gui/package-lock.json
      - name: install
        working-directory: crates/gui
        run: npm ci
      - name: typecheck
        working-directory: crates/gui
        run: npx tsc --noEmit
      - name: test
        working-directory: crates/gui
        run: npm test
