name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  cli:
    name: CLI ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      # Pin third-party actions to immutable commits: a mutable tag in the
      # release path would undermine the provenance we publish below.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install Linux dependencies (dbus for keyring)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: build
        run: cargo build --release -p xfade --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          set -e
          mkdir -p dist
          RELEASE_DIR="target/${{ matrix.target }}/release"
          BIN="$RELEASE_DIR/xfade"
          if [ "$RUNNER_OS" = "Windows" ]; then BIN="$RELEASE_DIR/xfade.exe"; fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "dist/xfade-${{ matrix.target }}.zip" "$BIN"
          else
            tar czf "dist/xfade-${{ matrix.target }}.tar.gz" -C "$RELEASE_DIR" xfade
          fi
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum xfade-* > "../checksums-${{ matrix.target }}.txt"
          else
            shasum -a 256 xfade-* > "../checksums-${{ matrix.target }}.txt"
          fi
          cd ..
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli-${{ matrix.target }}
          path: |
            dist/xfade-*
            checksums-*.txt

  gui:
    name: GUI macOS (dmg)
    runs-on: macos-15
    # The CLI is the primary distribution and carries security fixes. GUI
    # packaging is best-effort while Developer ID/notarization is not yet
    # configured; a Tauri packaging failure must not suppress signed CLI assets.
    continue-on-error: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: crates/gui/package-lock.json
      - name: build sidecar
        shell: bash
        run: |
          cargo build --release -p xfade
          mkdir -p crates/gui/src-tauri/binaries
          cp target/release/xfade crates/gui/src-tauri/binaries/xfade-aarch64-apple-darwin
      - name: install frontend deps
        working-directory: crates/gui
        run: npm ci
      - name: tauri build
        working-directory: crates/gui
        run: npx tauri build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gui-dmg
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app

  release:
    name: Publish release
    needs: [cli, gui]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      # SBOM is generated before checksums so it is covered by SHA256SUMS, the
      # Sigstore signature and the build provenance attestation.
      - name: Generate CycloneDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          cargo install --locked --version 0.5.10 cargo-cyclonedx
          mkdir -p release
          scripts/gen-sbom.sh release/xfade.cdx.json

      - name: Assemble release assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -name 'xfade-*' -exec cp {} release/ \;
          find artifacts -name '*.dmg' -exec cp {} release/ \;
          cd release
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' \
            | LC_ALL=C sort \
            | xargs sha256sum > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Install Cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0

      - name: Sign checksum manifest with Sigstore
        shell: bash
        run: |
          set -euo pipefail
          cosign sign-blob \
            --yes \
            --bundle release/SHA256SUMS.sigstore.json \
            release/SHA256SUMS
          cosign verify-blob \
            --bundle release/SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            release/SHA256SUMS

      - name: Attest release provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release/*

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            release/xfade-*
            release/*.dmg
            release/xfade.cdx.json
            release/SHA256SUMS
            release/SHA256SUMS.sigstore.json

  # Bump the standalone Homebrew tap (xfade-dev/homebrew-xfade) right after the
  # release is published. Runs on the same tag push; the tap push uses a
  # write-enabled deploy key (secret TAP_DEPLOY_KEY) scoped to that repo only.
  homebrew-tap:
    name: Update Homebrew tap
    needs: [release]
    runs-on: ubuntu-22.04
    if: github.repository == 'xfade-dev/xfade'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Bump tap formula
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          bash scripts/update-homebrew-formula.sh "${GITHUB_REF_NAME}"
