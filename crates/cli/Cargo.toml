[package]
name = "asw"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "asw"
path = "src/main.rs"

[dependencies]
agent-switch-core = { path = "../core" }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
dialoguer = "0.11"
tokio = { workspace = true }
time = { workspace = true }
reqwest = { workspace = true }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = { workspace = true }
