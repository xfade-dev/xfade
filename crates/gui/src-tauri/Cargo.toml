[package]
name = "asw-gui"
version = "0.1.0"
description = "Agent Switch GUI"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "asw_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
agent-switch-core = { path = "../../core" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time"] }
tauri = { version = "2.11.3" }
tauri-plugin-log = "2"

[dev-dependencies]
tempfile = "3"
